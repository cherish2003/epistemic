[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic"
version = "0.1.0"
description = "Epistemic types: values that carry provenance, confidence, validity and conflict information"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["epistemic*"]
